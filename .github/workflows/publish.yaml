name: Prepare release (publication disabled)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact proposed tag (v followed by the package version)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test release guards without network or credentials
        run: python3 -m unittest discover -s test/release -v
      - name: Install verified Stack
        uses: ./.github/actions/install_stack
      - name: Prepare one checked and tested source distribution
        env:
          STACK_ROOT: ${{ runner.temp }}/hal-release-stack
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: python3 scripts/release/prepare.py prepare --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/hal-release"
      - name: Retain preparation evidence (not a package publication)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-preparation
          path: ${{ runner.temp }}/hal-release/
          if-no-files-found: error
          retention-days: 7
      - name: Publication disabled
        run: echo 'Preparation only. This workflow has no Hackage uploader or publication credentials.'
