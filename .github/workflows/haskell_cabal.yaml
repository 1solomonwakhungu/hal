name: Cabal Haskell Builds

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.18.2.0'
          cabal-update: false
      - name: Install the verified build client
        uses: ./.github/actions/install_cabal
      - name: Test input and installer guards
        run: |
          python3 -B -m unittest discover -s test/cabal_lane -p 'test_*.py' -v
          python3 -B test/cabal_lane/probe_preparation.py --work "$RUNNER_TEMP/preparation-probe"
      - name: Prepare pinned sources and resolved plans
        run: python3 .github/cabal-lane/run.py prepare --work "$RUNNER_TEMP/cabal-lane"
      - name: Qualify builds, examples, sdist and setup routes
        run: python3 .github/cabal-lane/run.py build --work "$RUNNER_TEMP/cabal-lane"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cabal-lane-linux-x86-64
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/preparation-probe/
            ${{ runner.temp }}/cabal-lane/*.json
            ${{ runner.temp }}/cabal-lane/manifests/
            ${{ runner.temp }}/cabal-lane/logs/
            ${{ runner.temp }}/cabal-lane/**/cache/plan.json
