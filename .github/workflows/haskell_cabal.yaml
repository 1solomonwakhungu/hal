name: Cabal Haskell Builds

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.14.1.1'
      - name: Check generated package description
        run: |
          cabal update
          cabal install hpack-0.37.0 --ignore-project
          hpack --force
          git diff --exit-code -- hal.cabal
      - name: Build and test the frozen plan
        run: |
          cabal build all
          cabal test all --test-show-details=direct --test-options="+RTS -N2 -RTS"
          cabal check
          cabal sdist
      - name: Test the source distribution
        run: |
          mkdir sdist-check
          tar -xzf dist-newstyle/sdist/hal-1.1.tar.gz -C sdist-check
          cd sdist-check/hal-1.1
          cabal build all
          cabal test all --test-show-details=direct --test-options="+RTS -N2 -RTS"
          cabal check
