name: Stack Haskell Builds

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.14.1.1'
      - name: Install Stack
        uses: ./.github/actions/install_stack
      - name: Test the fixed snapshot
        run: |
          stack --no-docker --system-ghc --no-install-ghc test --jobs 2 --test-arguments="+RTS -N2 -RTS"
          stack --no-docker --system-ghc --no-install-ghc ls dependencies json --test > stack-dependencies.json
      - name: Build the examples
        run: stack --no-docker --system-ghc --no-install-ghc --stack-yaml examples/stack.yaml build --jobs 2
